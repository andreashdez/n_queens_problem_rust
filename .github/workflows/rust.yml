name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 11 * * 4'

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Format, lint, build, test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install rustfmt, clippy, and the web target
      run: |
        rustup component add rustfmt clippy
        rustup target add wasm32-unknown-unknown
    - name: Cache Rust dependencies and build output
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-${{ runner.os }}
    - name: Check formatting
      run: cargo fmt --check
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D clippy::pedantic -D clippy::nursery -D warnings
    - name: Run clippy for the web GUI
      run: cargo clippy --lib --bins --features gui --target wasm32-unknown-unknown -- -D clippy::pedantic -D clippy::nursery -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run default-feature tests
      run: cargo test --verbose
    - name: Run all-features tests
      run: cargo test --all-features --verbose
    - name: Run sweep example tests
      run: cargo test --all-features --examples --verbose
    - name: Install docs dependencies
      run: npm ci
    - name: Install Trunk
      env:
        TRUNK_VERSION: v0.22.0
        TRUNK_SHA256: f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2
      run: |
        curl -fsSL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz"
        echo "$TRUNK_SHA256  trunk.tar.gz" | sha256sum --check
        tar -xzf trunk.tar.gz -C "$HOME/.cargo/bin" trunk
        rm trunk.tar.gz
    - name: Build web GUI
      run: npm run build:gui
    - name: Check docs
      run: npm run check
    - name: Test documentation checks
      run: npm run test:docs
    - name: Verify CLI documentation and examples
      run: npm run check:examples
    - name: Build and check docs at the site root
      env:
        ASTRO_SITE: https://example.test
        ASTRO_BASE: /
      run: npm run build && npm run check:links
    - name: Build and check docs under a repository subpath
      env:
        ASTRO_SITE: https://example.test
        ASTRO_BASE: /docs-test/
      run: npm run build && npm run check:links

  clippy-sarif:
    name: Clippy SARIF analysis
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - uses: actions/checkout@v4
    - name: Install clippy
      run: rustup component add clippy
    - name: Cache Rust dependencies and build output
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: sarif-${{ runner.os }}
    - name: Install SARIF tools
      run: |
        command -v clippy-sarif >/dev/null || cargo install --locked clippy-sarif
        command -v sarif-fmt >/dev/null || cargo install --locked sarif-fmt
    - name: Run clippy and generate SARIF
      run: cargo clippy --all-features --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
      continue-on-error: true
    - name: Upload analysis results to GitHub
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: rust-clippy-results.sarif
        wait-for-processing: true
