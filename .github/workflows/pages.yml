name: Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      # The web GUI at /demo/ is built from the crate.
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Trunk.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro site and web GUI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Install the Rust web target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-${{ runner.os }}

      - name: Install Trunk
        env:
          TRUNK_VERSION: v0.22.0
          TRUNK_SHA256: f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2
        run: |
          curl -fsSL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "$TRUNK_SHA256  trunk.tar.gz" | sha256sum --check
          tar -xzf trunk.tar.gz -C "$HOME/.cargo/bin" trunk
          rm trunk.tar.gz

      - name: Build web GUI
        working-directory: website
        run: npm run build:gui

      - name: Check site
        working-directory: website
        run: npm run check

      - name: Build site
        working-directory: website
        env:
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Check built links and assets
        working-directory: website
        run: npm run check:links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
