name: Sync Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "website/content/docs/**"
      - "scripts/wiki-home.py"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Publish documentation links to Wiki Home
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync documentation links to Wiki Home
        run: |
          set -euo pipefail

          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"

          if ! git ls-remote "$WIKI_URL" >/dev/null 2>&1; then
            echo "GitHub Wiki is not enabled or not accessible; skipping sync."
            echo "Enable Wiki in repository settings and re-run this workflow."
            exit 0
          fi

          git clone "$WIKI_URL" wiki

          python scripts/wiki-home.py wiki/Home.md

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WIKI_BRANCH="$(git symbolic-ref --short -q HEAD || true)"
          if [ -z "$WIKI_BRANCH" ]; then
            WIKI_BRANCH="master"
            git checkout -B "$WIKI_BRANCH"
          fi

          git add Home.md

          if git diff --cached --quiet -- Home.md; then
            echo "Wiki Home is already up to date."
            exit 0
          fi

          git commit -m "docs: sync wiki links to Pages guides"
          git push origin "HEAD:${WIKI_BRANCH}"
