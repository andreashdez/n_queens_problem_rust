[package]
name = "n_queens_problem"
version = "0.1.0"
edition = "2024"
default-run = "n_queens_problem"

[dependencies]
rand = "0.10"
log = "0.4"
simple_logger = "5.2"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
serde_json = "1.0"
web-time = "1.1"
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_plot = { version = "0.38", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `rand::rng()` seeds from the browser's `crypto.getRandomValues`.
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Node", "Url", "Window"] }

[features]
default = []
gui = ["dep:eframe", "dep:egui_plot", "dep:rfd", "dep:serde", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
bench-internals = []

[dev-dependencies]
criterion = "0.8"
proptest = "1.11"

[[bin]]
name = "n_queens_problem"
path = "src/main.rs"

[[bin]]
name = "n_queens_gui"
path = "src/bin/n_queens_gui.rs"
required-features = ["gui"]

[[bench]]
name = "ga"
harness = false
