[package]
name = "n_queens_problem"
version = "0.1.0"
edition = "2024"
default-run = "n_queens_problem"

[dependencies]
rand = "0.10"
log = "0.4"
simple_logger = "5.2"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
serde_json = "1.0"
web-time = "1.1"
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_plot = { version = "0.38", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
# The Slint GUI, which is replacing the egui one: `cargo run --features gui-slint --bin n_queens_slint`.
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility"] }
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "simd"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17", optional = true }
arboard = { version = "3.7", optional = true, default-features = false }

# On Linux the Slint GUI sets its window's app ID through winit. The exact Slint
# version pin above keeps this unstable API from changing under us.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["unstable-winit-030"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `rand::rng()` seeds from the browser's `crypto.getRandomValues`.
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Blob", "BlobPropertyBag", "Clipboard", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Navigator", "Node", "Storage", "Url", "Window"] }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[features]
default = []
# The state, solver worker and texts both GUIs share. Enable `gui` or `gui-slint` rather than this.
gui-common = ["dep:rfd", "dep:serde", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
gui = ["gui-common", "dep:eframe", "dep:egui_plot"]
gui-slint = ["gui-common", "dep:slint", "dep:slint-build", "dep:tiny-skia", "dep:arboard"]
bench-internals = []

[dev-dependencies]
criterion = "0.8"
proptest = "1.11"
i-slint-backend-testing = "=1.18.1"

[[bin]]
name = "n_queens_problem"
path = "src/main.rs"

[[bin]]
name = "n_queens_gui"
path = "src/bin/n_queens_gui.rs"
required-features = ["gui"]

[[bin]]
name = "n_queens_slint"
path = "src/bin/n_queens_slint.rs"
required-features = ["gui-slint"]

[[bench]]
name = "ga"
harness = false
