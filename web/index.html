<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N-Queens Solver</title>
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="n_queens_gui" data-cargo-features="gui" />
    <link data-trunk rel="icon" href="../public/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #f8f8f8;
        color: #333;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1b1b1b;
          color: #ddd;
        }
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      #n_queens_status {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>N-Queens Solver</h1>
    <canvas id="n_queens_canvas"></canvas>
    <!-- The app removes this once it starts, or replaces it with an error. -->
    <p id="n_queens_status">Loading the solver…</p>
  </body>
</html>
